services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sansa
      POSTGRES_PASSWORD: sansa_local_only
      POSTGRES_DB: sansa_os
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sansa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sansa -d sansa_os"]
      interval: 5s
      retries: 10

volumes:
  sansa_postgres:
